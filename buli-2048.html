<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf4e7">
  <title>卟哩2048 · 小房子</title>
  <link rel="icon" href="buli-head-snack.png">
  <link rel="stylesheet" href="island-revive.css">
  <link rel="stylesheet" href="buli-2048.css?v=20261106-touch">
  <script defer src="island-revive.js"></script>
  <script defer src="buli-2048.js"></script>
  <script defer src="buli-2048-ui.js?v=20261106-touch"></script>
<script defer src="mobile-screen.js?v=touch-20261106" data-touch-only></script></head>
<body>
  <main id="game-shell" class="game-shell">
    <header class="topbar">
      <a class="home-link" href="index.html" aria-label="返回小房子">‹ 小房子</a>
      <h1>卟哩<span>2048</span></h1>
      <img class="title-cat" src="buli-head-snack.png" alt="" width="44" height="44" draggable="false">
    </header>
    <div class="game-layout">
      <section class="scoreboard" aria-label="游戏分数">
        <div class="score-box"><span>本局分数</span><strong id="score">0</strong><small id="score-gain" aria-hidden="true"></small></div>
        <div class="score-box best-box"><span>最高纪录</span><strong id="best">0</strong></div>
      </section>
      <div class="board-caption"><span id="milestone">最大数字 · 2</span><span id="moves">0 步</span></div>
      <div id="board" class="board" role="grid" aria-rowcount="4" aria-colcount="4" tabindex="0" aria-label="2048棋盘" aria-describedby="controls-tip">
        <div id="slots" class="slots" role="rowgroup"></div>
        <div id="tiles" class="tiles" aria-hidden="true"></div>
      </div>
      <div class="game-hints">
        <p id="controls-tip">滑动棋盘，相同数字合并。<span class="keyboard-tip">键盘用方向键。</span></p>
        <p id="announcement" role="status" aria-live="polite">试着把两个 2 合成 4。</p>
        <p id="save-note" hidden>浏览器暂时不能保存。</p>
      </div>
      <div class="main-actions">
        <button id="undo" type="button" disabled>撤销一步</button>
        <button id="new-game" class="primary" type="button">开始新局</button>
      </div>
    </div>
  </main>
  <section id="overlay" class="result-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div id="result-card" class="result-card">
      <p id="result-kicker"></p>
      <h2 id="result-title"></h2>
      <p id="result-copy"></p>
      <div class="result-actions">
        <button id="continue" class="primary" type="button">继续挑战</button>
        <button id="overlay-undo" type="button">撤销一步</button>
        <button id="try-again" type="button">再来一局</button>
      </div>
    </div>
  </section>
  <dialog id="new-dialog" class="new-dialog" aria-labelledby="new-title" aria-describedby="new-copy">
    <h2 id="new-title">开始新局？</h2>
    <p id="new-copy">当前棋盘会重新摆放。最高纪录会保留。</p>
    <div class="dialog-actions">
      <button id="cancel-new" type="button">取消</button>
      <button id="confirm-new" class="primary" type="button">开始新局</button>
    </div>
  </dialog>
  <noscript>请开启浏览器的 JavaScript 来玩卟哩2048。</noscript>
</body>
</html>
